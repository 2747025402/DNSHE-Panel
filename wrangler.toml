# DNSHE-Panel · DNSHE 多账号域名集控面板
#
# 由 lioil522/dnshe-manager 二次开发而来：在上游基础上补齐概览指标卡与账户配额、
# 域名注册查重、运行日志、API 密钥集中管理与域名助力等功能。
name = "dnshe-panel"
main = "src/index.ts"
compatibility_date = "2024-04-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "shydns-console-db"
database_id = "6a01f49c-db70-40f3-b1e6-db4a3d9afd55"

# 域名助力缓存
[[kv_namespaces]]
binding = "ASSIST_KV"
id = "f44739ac9544450da6f1b585fdd51fdf"

# 定时任务：**每天凌晨 3 点跑一轮**，一轮内**在预算内尽量多扫**账号（游标见 cron.ts 的 sync_cursor）。
#
# 🔴 2026-10-15 从「每小时」改为「每天一次」，理由：
#    这个 cron 同时承担两件事 —— ①同步域名列表 ②**自动续期**到期域名（阈值 180 天）。
#    ①可以懒（稳态已靠 updated_at 增量，没变过的域名不发请求）；
#    ②不能停（DNSHE 免费域名有效期仅 1 年，漏续期 = 域名永久丢失，不可逆）。
#    续期阈值 180 天，每天检查一次有 180 次纠错机会，绰绰有余；
#    而 D1 写入从 ~4,461 行/天 降到 ~186 行/天（降 96%）。
#    ⇒ 结论：降频可以，**改成纯手动同步不行**（无人值守时续期会漏）。
#
# ✅ 不会再撞 Workers 免费版单次调用 50 个子请求的上限，靠的是两层收敛：
#    ① 增量：上游 subdomains/list 免费带回 updated_at，没变过的域名不再发 listDnsRecords
#       （稳态每个账号只花 1 次子请求）；
#    ② 预算：SYNC_SUBREQUEST_BUDGET = 34，按**域名**截断，剩下的账号留给下一轮。
#    ⚠️ 改这里/改 syncOneAccountDomains 前先读 README 的「Worker 子请求上限的处理」。
[triggers]
crons = ["0 3 * * *"]

[vars]
# AES_KEY 走 wrangler secret put 注入，用于加密 API Secret、API 密钥 Secret 与 2FA 密钥
